name: POKE64
options:
  bundleIdPrefix: it.biosfera
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.0
    CLANG_CXX_LANGUAGE_STANDARD: c++17
    CLANG_CXX_LIBRARY: libc++
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGN_STYLE: Automatic

targets:
  POKE64:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: POKE64
        excludes:
          - App/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.biosfera.poke64
        PRODUCT_NAME: POKE64
        INFOPLIST_FILE: POKE64/App/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: POKE64/App/POKE64-Bridging-Header.h
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        OTHER_LDFLAGS:
          - $(inherited)
          - -ldl
    dependencies:
      - sdk: AVFoundation.framework
      - sdk: AudioToolbox.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
    preBuildScripts:
      - name: Embed and sign VICE libretro core
        path: Scripts/embed_core.sh
        basedOnDependencyAnalysis: false
